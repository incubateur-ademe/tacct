allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': false
  core-js: false
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: false

minimumReleaseAgeExclude:
  - nodemailer@10.0.12

# Correctifs de sécurité sur des dépendances transitives (nivo, maplibre)
overrides:
  'lodash@<4.18.1': ^4.18.1
  'protocol-buffers-schema@<3.6.1': ^3.6.1

nodeLinker: hoisted

# Refuse d'installer des packages publiés il y a moins de 7 jours (10080 minutes)
# pour laisser le temps à la communauté de détecter d'éventuels packages compromis
# minimumReleaseAge: 2880

# Fait échouer l'installation si un package perd en niveau de confiance
# par rapport à ses versions précédentes (ex: package signé qui ne l'est plus)
# trustPolicy: no-downgrade
