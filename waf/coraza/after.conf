# Cookie PostHog (ph_phc_<projet>_posthog) : JSON d'analytics qui contient des clés comme
# "$initial_person_info". La règle 942290 (injection MongoDB) y voit l'opérateur "$in" :
# 618 requêtes réelles sur 867 signalées le 09/11/2026. Ce cookie n'est lu que par PostHog.
# Ligne reprise telle quelle du secrules.conf de tacct-nginx.
SecRuleUpdateTargetByTag OWASP_CRS "!REQUEST_COOKIES:/^ph_phc_/"
