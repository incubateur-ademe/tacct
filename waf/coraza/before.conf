# Server Actions de Next.js (en-tête Next-Action) : corps envoyé en text/plain;charset=UTF-8.
# Sans text/plain, la règle 920420 les bloque (16 requêtes sur 867 mesurées le 09/11/2026).
# tacct-nginx ouvre text/plain sur toutes les routes (règle 900220 de son crs-setup.conf) ;
# ici, seulement sur les requêtes qui portent Next-Action. Liste de tacct-nginx, en entier.
SecRule &REQUEST_HEADERS:Next-Action "@gt 0" "id:31001,phase:1,pass,nolog,t:none,setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |text/xml| |application/xml| |application/soap+xml| |application/json| |text/plain|'"

# Outil de saisie legacy relayé par Next.js sous /workspace-tacct (rewrite de next.config.mjs).
# Ses types de contenu ne sont pas relevés : liste de tacct-nginx gardée sur ce préfixe.
SecRule REQUEST_FILENAME "@beginsWith /workspace-tacct/" "id:31002,phase:1,pass,nolog,t:none,setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |text/xml| |application/xml| |application/soap+xml| |application/json| |text/plain|'"
